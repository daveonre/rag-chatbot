server {
    listen 80;

    # 1. Direct route for FastAPI Health Check
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. Route ALL Backend API requests (Chat, Document Upload, Query, etc.)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Increased client body size for large PDF uploads
        client_max_body_size 50M;
    }

    # 3. Serve the React Frontend UI for everything else
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Essential for React Client-Side Routing (so refreshing /chat doesn't give a 404)
        try_files $uri $uri/ /index.html;
    }
}